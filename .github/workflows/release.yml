name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          P12_B64: ${{ secrets.CODESIGN_P12 }}
          P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys -clcerts \
            -passin pass:"$P12_PASSWORD" -out "$RUNNER_TEMP/cert.crt"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -A
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security add-trusted-cert -p codeSign -k "$KEYCHAIN" "$RUNNER_TEMP/cert.crt"
          rm "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.crt"
          security find-identity -v -p codesigning

      - name: Build signed DMG
        env:
          SELF_SIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: ./scripts/build-release.sh ${{ steps.version.outputs.version }}

      - name: Compute SHA256
        id: sha
        run: |
          SHA=$(shasum -a 256 .build/release-bundle/WindowManager-${{ steps.version.outputs.version }}.dmg | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            ".build/release-bundle/WindowManager-${{ steps.version.outputs.version }}.dmg" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: fhntvv/homebrew-apps
          token: ${{ secrets.TAP_REPO_TOKEN }}
          path: tap

      - name: Update cask
        run: |
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${{ steps.version.outputs.version }}/g" \
              -e "s/@SHA256@/${{ steps.sha.outputs.sha256 }}/g" \
              homebrew/windowmanager.rb > tap/Casks/windowmanager.rb

      - name: Commit and push cask
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/windowmanager.rb
          if git diff --cached --quiet; then
            echo "No changes to cask"
            exit 0
          fi
          git commit -m "windowmanager ${{ steps.version.outputs.version }}"
          git push
